-->
<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Unity WebGL Player | BrainGames2</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed; /* Prevent bounce on iOS */
        
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #231F20;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="1"></canvas>
    <script src="Build/webgl.loader.js"></script>
    <script>
      // Detect iOS 
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      var isIOSSafari = isIOS && isSafari;
      // Parse gameType from query string for handshake
      function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }
      const gameType = parseInt(getQueryParam('gameType'), 10) || 0;

      // Expose a global JS function for Unity (C#) to call when GameManager is ready
      function onUnityReady(gameType) {
        window.parent.postMessage(
          JSON.stringify({ type: 'unityReady', gameType: gameType }),
          '*'
        );
      }

      // If on mobile, we already set the canvas style accordingly.
      // For desktop, update the internal resolution with a resize listener:
      function resizeCanvas() {
        var canvas = document.getElementById("unity-canvas");
        // Update the internal resolution to match the CSS size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // Prevent ALL key-based scrolling
      window.addEventListener('keydown', function(e) {
        if (e.keyCode === 32 || e.keyCode === 37 || e.keyCode === 38 || 
            e.keyCode === 39 || e.keyCode === 40) {
          e.preventDefault();
          return false;
        }
      }, { passive: false });
      
      var canvas = document.getElementById("unity-canvas");
      
      // Force focus immediately
      canvas.focus();
      
      // More aggressive touch handling for iOS Safari
      function handleTouchEvent(e) {
        // Prevent default behavior for ALL touch events
        e.preventDefault();
        // Force focus
        canvas.focus();
        return false;
      }
      
      // Prevent default touch behaviors on iOS
      if (isIOSSafari) {
        // Add capturing phase listeners to prevent default behaviors
        document.addEventListener('touchstart', handleTouchEvent, { capture: true, passive: false });
        document.addEventListener('touchmove', handleTouchEvent, { capture: true, passive: false });
        document.addEventListener('touchend', handleTouchEvent, { capture: true, passive: false });
        
        // Also handle mouse events similarly
        document.addEventListener('mousedown', function(e) {
          canvas.focus();
          e.preventDefault();
          return false;
        }, { capture: true, passive: false });
      } else {
        // For non-iOS devices, simpler focus handling
        document.addEventListener('touchstart', function() {
          canvas.focus();
        }, false);
        document.addEventListener('mousedown', function() {
          canvas.focus();
        }, false);
      }

      var unityInstance = null;
      createUnityInstance(document.getElementById("unity-canvas"), {
        dataUrl: "Build/webgl.data",
        frameworkUrl: "Build/webgl.framework.js",
        codeUrl: "Build/webgl.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Cogmuse",
        productName: "BrainGames2",
        productVersion: "3.0.3",
        matchWebGLToCanvasSize: true,
        mobileBindingSettingsURL: null,
        showBanner: false
      }).then(function(instance) {
        unityInstance = instance;
        console.log("Unity instance created.");
                
        // After Unity loads, configure input handling
        if (unityInstance.Module) {
          // For iOS Safari, we need to be more aggressive about input capturing
          if (isIOSSafari) {
            // Disable all default browser actions
            if (typeof unityInstance.Module.WebGLInput !== "undefined") {
              if (typeof unityInstance.Module.WebGLInput.captureAllKeyboardInput !== "undefined") {
                unityInstance.Module.WebGLInput.captureAllKeyboardInput = true;
              }
              // Some Unity versions use different properties
              if (typeof unityInstance.Module.WebGLInput.engineInput !== "undefined") {
                unityInstance.Module.WebGLInput.engineInput.preventDefaultKeyboardEvents = true;
              }
              if (typeof unityInstance.Module.WebGLInput.mouseEvents !== "undefined") {
                unityInstance.Module.WebGLInput.mouseEvents.preventDefault = true;
              }
            }
          }
        }
        // Remove early handshake; C# will call onUnityReady when ready.
        // Listen for resource updates from parent and forward into Unity
        window.addEventListener('message', function(e) {
          let msg;
          try { msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch { return; }
          if (msg.type !== 'setResource') return;
          // Send to Unity GameManager JSSetResource
          unityInstance.SendMessage(
            'GameManager',
            'JSSetResource',
            JSON.stringify({ key: msg.key, value: msg.value })
          );
        });
      }).catch(function(message) {
        alert(message);
      });
    </script>
  </body>
</html>
